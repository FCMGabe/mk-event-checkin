<!DOCTYPE html>
<!-- Event QR Check-In (Org: All — FC / CoK / MK)
     ?form=<Jotform form ID>          -> guest check-in page for that event
     ?form=<Jotform form ID>&sign=1   -> printable QR sign for that event
     (no ?form)                        -> staff tool: paste a form link, get its sign
     Talks to the Apps Script "Jotform Check-In Connector" without the guest's Google account. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Check-In</title>
<link rel="icon" href="mk-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
  /* Mitzvah Kitchen brand kit */
  :root{
    --navy:#1b365d; --green:#b5bd00; --offwhite:#fafaf7; --charcoal:#2f2f2f;
    --sage:#8fa89a; --mist:#e6e8e1; --sand:#d8cfc4; --clay:#bf9f8c;
    --muted:#5c6470;
  }
  *{box-sizing:border-box}
  body{font-family:'Open Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--offwhite);margin:0;padding:24px 16px;color:var(--charcoal)}
  .logo{display:block;width:180px;max-width:60%;height:auto;margin:0 auto 16px}
  .card{max-width:420px;margin:0 auto;background:#fff;border-radius:16px;padding:28px 22px;border-top:6px solid var(--green);box-shadow:0 4px 18px rgba(27,54,93,.10)}
  h1{font-size:24px;margin:0 0 4px;color:var(--navy)}
  p.sub{margin:0 0 20px;color:var(--muted)}
  label{font-weight:600;font-size:15px;color:var(--navy)}
  input{width:100%;font-size:18px;padding:14px;border:1px solid var(--sand);border-radius:10px;margin:8px 0 16px;font-family:inherit;color:var(--charcoal)}
  input:focus{outline:3px solid var(--green);outline-offset:1px;border-color:var(--navy)}
  button,a.btn{display:block;width:100%;text-align:center;font-family:inherit;font-size:18px;font-weight:700;padding:14px;border:0;border-radius:10px;background:var(--navy);color:#fff;text-decoration:none;cursor:pointer}
  button:hover,a.btn:hover{background:#142a49}
  button:focus-visible,a.btn:focus-visible{outline:3px solid var(--green);outline-offset:2px}
  button:disabled{opacity:.6}
  .msg{margin-top:18px;padding:16px;border-radius:10px;font-size:17px;line-height:1.45;border-left:6px solid}
  .ok{background:var(--mist);color:var(--navy);border-color:var(--green)}
  .warn{background:#f4efe9;color:var(--charcoal);border-color:var(--clay)}
  .err{background:#fbecec;color:#7f1d1d;border-color:#b42318}
  .msg a.btn{margin-top:12px}
  .hidden{display:none}
  /* Printable sign */
  .sign{max-width:640px;margin:0 auto;background:#fff;text-align:center;padding:36px 24px 40px;border-radius:16px;border-top:10px solid var(--green)}
  .sign .logo{width:240px}
  .sign h1{font-size:44px;margin:0 0 8px;color:var(--navy)}
  .sign .event{font-size:22px;color:var(--muted);margin:0 0 24px}
  .sign #qr{display:inline-block;padding:14px;background:#fff;border:3px solid var(--navy);border-radius:12px}
  .sign #qr img,.sign #qr canvas{display:block;width:min(66vw,360px)!important;height:auto!important}
  .sign .hint{font-size:22px;margin:24px 0 0;color:var(--navy);font-weight:600}
  .print{max-width:640px;margin:16px auto 0}
  @page{margin:0}
  @media print{body{background:#fff;padding:0.6in 0.5in}.print{display:none}.sign{box-shadow:none}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>

<!-- Guest check-in -->
<div class="hidden" id="guestWrap"><img class="logo" src="mk-logo.png" alt="Mitzvah Kitchen">
<div class="card" id="guest">
  <h1>Welcome!</h1>
  <p class="sub" id="eventName">Check in below</p>
  <form id="f">
    <label for="email">Email you registered with</label>
    <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
    <button id="go" type="submit">Check In</button>
  </form>
  <div id="out" role="status" aria-live="polite"></div>
</div>
</div>

<!-- Printable sign -->
<div class="hidden" id="signView">
  <div class="sign">
    <img class="logo" src="mk-logo.png" alt="Mitzvah Kitchen">
    <h1>Scan to Check In</h1>
    <p class="event" id="signEvent"></p>
    <div id="qr"></div>
    <p class="hint">Use the email you registered with</p>
  </div>
  <div class="print"><button onclick="window.print()">Print this sign</button></div>
</div>

<!-- Staff: make a sign -->
<div class="card hidden" id="staff">
  <h1>Make a check-in sign</h1>
  <p class="sub">Paste the Jotform registration link (or form ID). The form needs the hidden "Checked In" field — copies of the template already have it.</p>
  <form id="sf">
    <label for="link">Jotform link or form ID</label>
    <input id="link" required placeholder="https://form.jotform.com/...">
    <button id="sgo" type="submit">Make sign</button>
  </form>
  <div id="sout" role="status" aria-live="polite"></div>
</div>

<!-- Message-only view -->
<div class="card hidden" id="note"><h1 id="noteTitle"></h1><p class="sub" id="noteText"></p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // The Apps Script web app. Same for every event — never changes.
  const API = 'https://script.google.com/macros/s/AKfycbzlRmI3zQ9dSn3dWi09gSKL1MrU-pZqHMCqr_tgY-flCgUfzkgQ2GsGhHZDIqDSS_Fziw/exec';
  const STAFF_MSG = 'Something went wrong. Please see a staff member at the door.';

  const params = new URLSearchParams(location.search);
  const formId = (params.get('form') || '').replace(/\D/g, '');
  const $ = id => document.getElementById(id);
  const show = id => $(id).classList.remove('hidden');
  const call = q => fetch(API + '?' + q, { credentials: 'omit' }).then(r => r.json());
  // Public address printed in every QR code, no matter where the page was opened.
  const SITE = 'https://checkin.mitzvahkitchen.org/';
  const pageUrl = id => SITE + '?form=' + id;

  function note(title, text) { $('noteTitle').textContent = title; $('noteText').textContent = text; show('note'); }

  if (!formId) {
    // ---------- Staff tool ----------
    show('staff');
    $('sf').addEventListener('submit', async e => {
      e.preventDefault();
      const id = ($('link').value.match(/\d{12,}/) || [''])[0];
      const out = $('sout'); out.innerHTML = '';
      const msg = (cls, t) => { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = t; out.appendChild(d); };
      if (!id) return msg('err', 'That doesn\'t look like a Jotform link or form ID.');
      $('sgo').disabled = true; $('sgo').textContent = 'Checking...';
      try {
        const info = await call('form=' + id + '&info=1');
        if (info.ok) location.href = location.pathname + '?form=' + id + '&sign=1';
        else msg('err', 'This form isn\'t set up for check-in yet. Add hidden fields named "Checked In" and "Check-In Time", or start from the template.');
      } catch (_) { msg('err', 'Could not reach the check-in service. Try again.'); }
      $('sgo').disabled = false; $('sgo').textContent = 'Make sign';
    });
  } else {
    call('form=' + formId + '&info=1').then(info => {
      if (!info.ok) return note('Check-in isn\'t open', 'This event isn\'t set up for check-in. Please see a staff member at the door.');
      document.title = 'Check In - ' + info.title;
      if (params.get('sign')) {
        // ---------- Printable sign ----------
        $('signEvent').textContent = info.title;
        new QRCode($('qr'), { text: pageUrl(formId), width: 512, height: 512, colorDark: '#1b365d', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
        show('signView');
      } else {
        // ---------- Guest check-in ----------
        $('eventName').textContent = info.title;
        show('guestWrap');
      }
    }).catch(() => note('Check-in is unavailable', STAFF_MSG));

    const f = $('f'), go = $('go'), out = $('out');
    function msg(cls, text, link) {
      out.innerHTML = '';
      const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
      if (link) { const a = document.createElement('a'); a.className = 'btn'; a.href = link; a.textContent = 'Complete registration'; d.appendChild(a); }
      out.appendChild(d);
    }
    f.addEventListener('submit', async e => {
      e.preventDefault();
      go.disabled = true; go.textContent = 'Checking...'; out.innerHTML = '';
      try {
        const r = await call('form=' + formId + '&email=' + encodeURIComponent($('email').value));
        const hi = r.firstName ? (', ' + r.firstName) : '';
        if (r.status === 'ok') { msg('ok', 'Welcome' + hi + '! You are checked in. Enjoy the event!'); f.reset(); }
        else if (r.status === 'already') { msg('ok', 'Welcome back' + hi + '! You were already checked in' + (r.time ? (' at ' + r.time) : '') + '.'); f.reset(); }
        else if (r.status === 'not_registered') { msg('warn', "You have not RSVP'd to this event. Please complete your registration to check in.", r.registerUrl); }
        else if (r.status === 'invalid') { msg('err', 'Please enter a valid email address.'); }
        else { msg('err', STAFF_MSG); }
      } catch (_) { msg('err', STAFF_MSG); }
      go.disabled = false; go.textContent = 'Check In';
    });
  }
</script>
</body>
</html>
